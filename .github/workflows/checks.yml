name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate source and run unit tests
        run: python3 tools/check.py
      - name: Validate GitHub Actions workflows
        run: |
          set -euo pipefail
          lint_dir=$(mktemp -d "$RUNNER_TEMP/northforge-actionlint.XXXXXXXX")
          trap 'rm -rf -- "$lint_dir"' EXIT
          curl --fail --location --retry 2 \
            --output "$lint_dir/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          # Release hash is pinned here; do not trust a downloaded replacement checksum.
          printf '%s  %s\n' \
            '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757' "$lint_dir/actionlint.tar.gz" | sha256sum --check -
          tar -xzf "$lint_dir/actionlint.tar.gz" -C "$lint_dir" actionlint
          "$lint_dir/actionlint" -pyflakes= .github/workflows/*.yml
      - name: Check the target build plan without running privileged build code
        run: build/armbian.sh plan
