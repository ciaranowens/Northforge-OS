# Explicit directory binds from the LUKS2 volume /persist.
# Format: relative-source absolute-target
# Targets must be existing directories below /etc/northforge/config.d,
# /var/lib/northforge, /var/lib/docker/volumes, or /srv/northforge.
# No persistence is enabled by default. Examples (provision directories first):
# state/northforge /var/lib/northforge
# Configuration is copied into the initramfs by update-initramfs.
